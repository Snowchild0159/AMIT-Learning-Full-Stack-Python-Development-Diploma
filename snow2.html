<!DOCTYPE html>

  <head>

    <title>Document</title>

    <style>
      body {
        /* background-color: red; */
        background-image: linear-gradient(#0f0c29, #302b63, #24243e);
        background-repeat: no-repeat;
        height: 100vh;

        padding: 10px;
        position: relative;
      }
      main { 
        position: absolute;
        top: 50%;
        left: 50%;

        border-radius: 30px;
        height: 650px;
        overflow: hidden;

        /* border: 1psx solid black; */
      }
      .login-section{
      }
      .signup-form{
        height: 500px;
        padding: 10px;
        text-align: center;
        color: white;


      }
        h1{
            margin-top: 80px;
        }
      input{
        width: 80%;
        margin: 20px 0px;
        padding: 15px;
        border-radius: 12px;
      }

      input:focus {
        outline: 1px solid green;
      }
      .signup-button{
        padding: 10px 20px;

        background-color: white;
        border: none;
        display: block;


      }
      .login-form{
        text-align: center;
        background-color: white;

        border-radius: 10%;

      }
      .login-form h1 {
            margin-top: 40px;
      }
      .login-form:hover {
        transform: translateY(-380px);
      }
      .login-button{

        border: none;
        border-radius: 15px;
        background-color: #302b63;
        color: white;
        display: block;
        margin: 30px auto;
      }
    </style>
  </head>
