    function findMax(arr) {
    let max = arr[0];
    for (let i = 1; i < arr.length; i++) {
        if (arr[i] > max) {
            max = arr[i];
        }
    }
    return max;
}
console.log("Max =", findMax(numbers));


function findMin(arr) {
    let min = arr[0];
    for (let i = 1; i < arr.length; i++) {
        if (arr[i] < min) {
            min = arr[i];
        }
    }
    return min;
}
console.log("Min =", findMin(numbers));

class BankAccount {
  constructor(ownerName, balance) {
    this.ownerName = ownerName;
    this.balance = balance;
  }

  
  deposit(amount) {
    this.balance = this.balance + amount;
    console.log(amount, "deposited.");
  }

  withdraw(amount) {
    if (amount <= this.balance) {
      this.balance = this.balance - amount;
      console.log(amount, "withdrawn.");
    } else {
      console.log("Insufficient funds! Cannot withdraw", amount);
    }
  }

  checkBalance() {
    console.log("Current balance for", this.ownerName, "=", this.balance);
  }
}

let account = new BankAccount("Ali", 1000);

account.checkBalance();   
account.deposit(500);     
account.checkBalance();   
account.withdraw(300);    
account.checkBalance();   
account.withdraw(2000);   
account.checkBalance();   


class Library {
  constructor() {
    this.books = [];
  }

  addBook(title, author) {
    let newBook = { title: title, author: author };
    this.books.push(newBook);
    console.log("Book added:", title);
  }

  removeBook(title) {
    let index = -1;
    for (let i = 0; i < this.books.length; i++) {
      if (this.books[i].title === title) {
        index = i;
        break;
      }
    }

    if (index !== -1) {
      this.books.splice(index, 1);
      console.log("Book removed:", title);
    } else {
      console.log("Book not found:", title);
    }
  }

  listBooks() {
    if (this.books.length === 0) {
      console.log("No books in the library.");
      return;
    }

    console.log("Books in the library:");
    for (let i = 0; i < this.books.length; i++) {
      console.log("- Title:", this.books[i].title, "| Author:", this.books[i].author);
    }
  }
}

let myLibrary = new Library();

myLibrary.addBook("Book One", "Author A");
myLibrary.addBook("Book Two", "Author B");
myLibrary.listBooks();
myLibrary.removeBook("Book One");
myLibrary.listBooks();
