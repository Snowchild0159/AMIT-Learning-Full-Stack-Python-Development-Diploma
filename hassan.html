<html>
    <head>
        <title>
            Snow
        </title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Single+Ink:wght@100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        </head>
<body>
   
   <h1 class="snow">Contact Us</h1>
    <form style="font-size: large;" action="/submit-form" method="POST">
        <!-- Text Input -->
        <label class="snow snowy"  for="name">name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
        <br><br>
        <!-- Email Input -->
        <label style="color: red; for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br><br>

        <!-- Password Input -->
        <label style="color: red;  for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password"  required>
        <br><br>

        <!-- Radio Buttons -->
        <label style="color: blueviolet;">Gender:</label>
        <input type="Radio">
        <label for="male">Male</label>
        <input type="Radio">
        <label for="female">Female</label>

        <br><br>

        <!-- Checkbox -->
        <label style="font-size: x-large; color:brown;">
            <input type="checkbox" name="subscribe" value="yes">
            Subscribe to our newsletter
        </label>
        <br><br>

        <!-- Submit Button -->
        <button style="color: brown;" type="submit">Submit</button>
    </form>

</body>
</html>
