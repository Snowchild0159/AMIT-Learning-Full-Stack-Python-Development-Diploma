<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer{
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background-color: #333333;
            position: relative;
        }
        .inner{
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background-color: #555555;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50% , -50%);
        }
        .veryinner{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #eeeeee;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50% , -50%);
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">
            <div class="veryinner"></div>
        </div>
    </div>
</body>
</html>
