
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>
<body>
    

    <form  class="m-5" action="">
        <input placeholder="Enter your name" type="text" id="name-input" class="form-control my-3" name="name" >
        <input placeholder="Enter your GPA" type="number" id="gpa-input" class="form-control my-3" name="gpa" >
        <input placeholder="Enter your Role" type="text" id="role-input" class="form-control my-3" name="role" >

        <button id="add-student" class="btn btn-primary">Add Student</button>
    </form>

    <script>
        const form = document.querySelector("form")
        const name = document.querySelector("#name-input")
        const gpa = document.querySelector("#gpa-input")
        const role = document.querySelector("#role-input")

        form.addEventListener("submit" , (e) =>{
            e.preventDefault() 
            console.log(JSON.stringify({
                    name : name.value ,
                    gpa : gpa.value , 
                    role : role.value
                }))
            fetch("http://127.0.0.1:8000/students/" , {
                method : "POST" , 
                headers : {
                    'Content-Type' : 'application/json'
                }, 
                body : JSON.stringify({
                    name : name.value ,
                    gpa : gpa.value , 
                    role : role.value
                })
            })

        })
    </script>
</body>
</html>
